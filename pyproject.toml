[project]
name = "ml-improvement-platform"
version = "0.1.0"
description = "Closed-loop ML improvement platform: train, evaluate, gate, promote, monitor, retrain."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Runtime dependencies are added milestone-by-milestone, as each earns its place.
# M1 (baseline): data handling, schema validation, modelling, configuration.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pandera>=0.20",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ARG", "PTH", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["ml_platform"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that read the full dataset",
]
