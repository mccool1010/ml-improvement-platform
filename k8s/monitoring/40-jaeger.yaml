# Jaeger, all-in-one.
#
# There is no separate OpenTelemetry Collector in this deployment, and that is a
# decision rather than an omission. Jaeger accepts OTLP natively on 4318, which
# is exactly what the application exports, so a collector in between would add a
# hop, another Deployment and another failure mode while changing nothing about
# the traces that arrive. A collector earns its place when there are many
# producers to fan in, several backends to fan out to, or sampling and
# redaction to apply centrally. None of that is true here yet.
#
# In-memory storage. Traces are lost when the pod restarts, which is acceptable
# for a development cluster and is called out in docs/observability.md rather
# than hidden behind a volume that would only pretend to be durable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: ml-platform
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: tracing
    app.kubernetes.io/part-of: ml-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/component: tracing
        app.kubernetes.io/part-of: ml-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          imagePullPolicy: IfNotPresent
          args:
            - --memory.max-traces=20000
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-http
              containerPort: 4318
            - name: otlp-grpc
              containerPort: 4317
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: ui
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: ui
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: ml-platform
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: tracing
    app.kubernetes.io/part-of: ml-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
    # What the application exports to: OTEL_EXPORTER_OTLP_ENDPOINT is
    # http://jaeger:4318, resolved by cluster DNS like every other address here.
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
