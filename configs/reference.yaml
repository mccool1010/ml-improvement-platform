# Locked reference results.
#
# These are the numbers a rerun must reproduce, on the dataset whose SHA-256 is
# recorded below. They are the baseline against which every later milestone
# measures improvement.
#
# Do not edit these values to make a failing check pass. If a legitimate change
# moves them, that is a new reference: record why, and update the note below.
#
# REVISION, M3, 2026-09-06. Re-locked after a labelling bug was fixed.
#
# The two-digit-year correction pivoted on the observation cutoff of 2014-06-25,
# the last approval date in the register. Charge-offs legitimately post-date the
# approvals they follow, so 1,491 real mid-2014 charge-off dates were rewritten
# to 1914. The resulting negative time-to-default satisfied the in-horizon test
# and flipped 1,096 labels to positive. The pivot is now a fixed year, 2059, and
# the prepared schema asserts a plausibility range on every date column so the
# same class of fault fails loudly.
#
# Effect on the headline numbers, all small, no conclusion changed:
#   baseline  test AP 0.163209 -> 0.162915, ROC 0.725757 -> 0.729854
#   candidate test AP 0.701151 -> 0.703605, ROC 0.959988 -> 0.960345
# Usable rows fell from 682,428 to 682,421 and the test-split positive rate from
# 6.94% to 6.83%.

reference:
  milestone: M1 (re-locked at M3)
  recorded_at: "2026-09-06"
  commit: ce859b8
  dataset_sha256: 0359128a0b7599e83e4c2e4dcdd781d9121a765237f98d9f0ec1ab3e7c522548
  environment: production
  observable_rows: 682421
  # Content and row order of the prepared dataset, hashed together. Compared
  # exactly. A mismatch here explains any metric drift in one line, because
  # gradient boosting consumes rows in order. See docs/reproducibility.md.
  row_order_sha256: 7174370c6f491542

  # Tolerances are absolute differences on each metric.
  #
  # Observed behaviour on the reference platform is bit-exact: training was
  # verified to produce byte-identical predictions across separate processes and
  # across 1, 4 and 8 native threads. The tolerance is therefore not absorbing
  # expected local noise; it exists for two narrower reasons.
  #
  #   1. Run records round metrics to six decimal places, so a comparison must
  #      permit half a unit in the last place.
  #   2. A different platform may use a different BLAS build, whose reduction
  #      order can move the last bits of a floating-point sum.
  #
  # `strict` is what a same-platform rerun must meet. `portable` is the looser
  # bound for a rerun on different hardware or a different operating system.
  tolerances:
    strict:
      default: 0.000001
    portable:
      default: 0.0005
      # Threshold-derived metrics move in steps as ranks swap around the cut, so
      # they are permitted slightly more room than the smooth ranking metrics.
      precision_at_capacity: 0.002
      recall_at_capacity: 0.002
      lift_at_capacity: 0.02

  # Splits must match exactly. A difference here is a data or configuration
  # problem, not floating-point noise, so no tolerance applies.
  splits:
    train: { n_rows: 150158, n_positive: 4561 }
    validation: { n_rows: 54284, n_positive: 2563 }
    test: { n_rows: 53487, n_positive: 3651 }
    production_stream: { n_rows: 121664, n_positive: 23002 }

  models:
