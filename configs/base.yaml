# Base configuration. Environment files (development/production) override these keys.
project_name: ml-improvement-platform
seed: 42

determinism:
  # Native thread pools are pinned so parallel floating-point reductions always
  # sum in the same order. Gradient boosting is the sensitive component: its
  # histogram accumulation is parallelised over samples, so the thread count
  # changes the last bits of every split gain. Training here takes seconds, so
  # single-threaded costs nothing worth having.
  n_threads: 1
  # Row order is not cosmetic. Approval dates tie thousands of times per day, and
  # gradient boosting bins and accumulates in row order, so the tie order changes
  # the model. Switching this from quicksort to stable was measured to move
  # candidate average precision from 0.701151 to 0.702866. The order produced is
  # fingerprinted into every run record and locked in configs/reference.yaml, so
  # any change in sorting behaviour fails loudly instead of drifting the metrics.
  row_sort_kind: quicksort

tracking:
  # MLflow records the run; it does not decide anything. The JSON run record in
  # artifacts/reports and configs/reference.yaml remain authoritative, and the
  # reproducibility check never reads MLflow.
  enabled: true
  experiment_name: sba-loan-default
  # MLflow 3 put the plain-file backend into maintenance mode and refuses it, so
  # runs go to a local SQLite database. Relative paths here resolve against the
  # project root, never the working directory. An absolute URI or a remote
  # http:// server passes through unchanged, so a tracking server can be
  # introduced later without a code change.
  backend_uri: sqlite:///mlflow.db
  artifact_dir: mlartifacts
  # Log the fitted pipeline as a run artifact. Registration is M6, not M4.
  log_model: true

data:
  source:
    name: sba-national-7a
    description: >-
      U.S. Small Business Administration 7(a)/504 national loan guarantee register,
      approvals from 1962 to 2014-06. Mirror of the dataset published with
      Li, Mickel & Taylor (2018), Journal of Statistics Education 26(1).
    url: https://huggingface.co/datasets/MaddRaf/SBAnational/resolve/main/SBAnational.csv
    filename: SBAnational.csv
    sha256: 0359128a0b7599e83e4c2e4dcdd781d9121a765237f98d9f0ec1ab3e7c522548
    expected_rows: 899164
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  # Last approval date present in the register. Acts as "today" for the whole
  # project: nothing after this instant may be treated as observed.
  observation_end: "2014-06-25"

label:
  # A loan is positive if it charged off within `horizon_months` of disbursement.
  # A row is only usable once its full horizon has elapsed before observation_end.
  # The inclusion rule does not depend on the outcome, so the label is unbiased.
  name: default_within_60m
  horizon_months: 60
  target_column: target

population:
  # Uniform exposure. Every loan must be scheduled to remain outstanding for the
  # whole horizon, so none matures early and all are at risk for the same 60
  # months. Without this, "charged off within 60 months" is partly a question of
  # whether the loan even lasted that long: measured on the unrestricted data the
  # default rate cliffs from 41% for 3-5 year loans to 8% for 5-7 year loans,
  # exactly at the horizon boundary, and Term alone then reproduces 96% of model
  # performance. Restricting costs 19.4% of rows and removes the artifact.
  min_term_months: 60

split:
  strategy: time_ordered
  date_column: ApprovalDate
  # Strictly ordered, non-overlapping, no shuffling. Training starts in 2000
  # because UrbanRural is effectively unpopulated before then (see docs/data.md).
  train:             { start: "2000-01-01", end: "2003-12-31" }
  validation:        { start: "2004-01-01", end: "2004-12-31" }
  test:              { start: "2005-01-01", end: "2005-12-31" }
  # Held back entirely from model development. Replayed as live traffic to
  # exercise drift detection, delayed-label evaluation and retraining.
  production_stream: { start: "2006-01-01", end: "2009-06-30" }

artifacts:
  # Resolved against the project root, never the working directory.
  model_dir: models
  benchmark_dir: artifacts/benchmarks

serving:
  # Where scoring happens. Null means the API loads the model into its own
  # process, which is how the local development server and the plain container
  # run. In Kubernetes the deployment sets ML_PLATFORM_PREDICTOR_URL to the
  # KServe InferenceService, and the API becomes the application tier in front
  # of it: validation, thresholds and version metadata, but not the model.
  # ADR-002 is the decision; there is only ever one path serving production.
  predictor_url: null
  # Must match the InferenceService name. KServe's V1 protocol addresses a named
  # model and the predictor refuses a name it does not serve.
  predictor_model_name: sba-loan-default
  predictor_timeout_seconds: 10.0

canary:
  # A candidate under canary holds this alias. It is deliberately not the
  # production alias: a model being tested must be identifiable and loadable
  # without already being what production means.
  alias: canary
  model_name: sba-loan-default-canary
  # Null and 0 mean no canary is running, which is the normal state. The
  # deployment sets ML_PLATFORM_CANARY_URL and ML_PLATFORM_CANARY_TRAFFIC_PERCENT
  # when one starts, so every API replica agrees on the allocation.
  predictor_url: null
  traffic_percent: 0.0
  observation_seconds: 300

  # Operational limits only. ADR-003 gives rollback authority to error rate,
  # latency, timeouts and serving health, and explicitly withholds it from
  # accuracy: realised performance takes five years to arrive on this dataset,
  # so a canary waiting for it would never conclude. Offline quality was already
  # judged by the M6 gates before any traffic moved.
  thresholds:
    # Below this, there is not enough evidence to decide either way. A `hold`
    # is not a failure.
    min_requests: 50
    # Absolute ceilings: unacceptable however the incumbent is doing.
    max_error_rate: 0.02
    max_failure_rate: 0.01
    max_latency_p95_seconds: 1.0
    # Relative to the incumbent, because the candidate is replacing something
    # specific. An absolute-only check passes a model twice as slow as
    # production that still sits inside the ceiling.
    max_error_rate_ratio: 2.0
    max_latency_ratio: 1.5

monitoring:
  # Retraining may only use rows whose 60-month horizon closed before the
  # observation cutoff. Left unset this is derived as observation_end minus the
  # label horizon; it is stated here so the rule is visible rather than implied.
  # This is the line between "a label that has matured" and one that would have
  # to be invented, and M13 never crosses it. See docs/drift.md.
  label_maturity_end: "2009-06-25"

  drift:
    # The distribution the production model is held to have learned.
    reference_split: train
    feature_set: engineered
    # PSI above which a single feature counts as drifted. 0.1 is the
    # conventional "noticeable shift" reading; 0.25 is "different population".
    threshold_psi: 0.1
    # How many features must move before this is a population-level event. One
    # feature can shift for a mundane reason, and retraining on every blip would
    # churn the registry for nothing.
    min_drifted_features: 3
    window:
      # A slice of the quarantined 2006..mid-2009 production stream, which no
      # model has trained on. Slicing by date is deterministic, so the same
      # dates always give the same rows and the same report.
      start: "2008-01-01"
      # The maturity cutoff, not the end of the production stream. Approvals
      # after this date have not had their 60-month horizon close before the
      # observation cutoff, so they carry no usable outcome.
      end: "2009-06-25"
      # `none` compares the real window. The named scenarios in
      # ml_platform.monitoring.windows perturb inputs only, never outcomes.
      scenario: none

observability:
  # Where traces go. Null means tracing is off, which is how the service runs on
  # a laptop and under test: there is no collector to export to. In Kubernetes
  # the deployment sets OTEL_EXPORTER_OTLP_ENDPOINT to the Jaeger Service.
  # Metrics are not conditional -- /metrics costs nothing when nobody scrapes it.
  otlp_endpoint: null

promotion:
  # Promotion is decided on the validation split. The test split is held-out
  # evidence; a threshold chosen against it, or a promotion justified by it,
  # turns it into a training signal and it stops being evidence for anything.
  decision_split: validation

  registered_model_name: sba-loan-default-classifier
  production_alias: production
  # How production is identified when nothing is registered yet. Never "the
  # newest run": that would let any accident become the incumbent.
  bootstrap_model: baseline

  gates:
    # Below this the difference is not distinguishable from run-to-run noise.
    min_improvement:
      metric: average_precision
      min_delta: 0.01
      required: true
    # An absolute floor, so a candidate cannot win merely by beating a poor
    # incumbent. Validation base rate is 0.0472 and the baseline reaches 0.1315,
    # so this demands roughly five times base rate and clear daylight over it.
    minimum_metric:
      metric: average_precision
      minimum: 0.25
      required: true
    # Guards against trading general ranking for a narrow gain.
    roc_auc_regression:
      metric: roc_auc
      max_decline: 0.005
      required: true
    # Probabilities must stay honest, not just the ordering. Under drift a model
    # can hold its ranking while its probabilities go badly wrong.
    calibration:
      max_decline: 0.0
      min_skill: 0.0
      required: true
    # The operating point the model actually informs.
    recall_regression:
      metric: recall_at_capacity
      max_decline: 0.0
      required: true
    # Derived from the evaluation pass, so this is batch throughput rather than
    # single-request latency. A true p99 needs the serving path, which is M7.
    # It still catches a candidate that is orders of magnitude slower.
    latency:
      max_mean_prediction_ms: 1.0
      required: true
    # An unreproducible result is not evidence, whatever it scores.
    reproducibility:
      require_clean_revision: true
      required: true

evaluation:
  primary_metric: average_precision
  secondary_metrics: [roc_auc, brier_score, brier_skill_score, recall_at_capacity]
  # Operating point: the share of applications a review team can examine.
  # A fixed precision target is not usable here because the base rate moves from
  # 6.8% to 33.8% across the study period. See docs/decisions/ADR-003.
  review_capacity: 0.10
  report_dir: artifacts/reports
